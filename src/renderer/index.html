<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cdn.discordapp.com https://media.discordapp.net; connect-src 'none'"
    />
    <title>Discord Server Builder</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="../shared/appearance.js"></script>
    <script src="js/theme.js"></script>
  </head>
  <body>
    <header class="titlebar">
      <img class="titlebar-logo" alt="" />
      <span class="titlebar-name"></span>
      <!-- Credit is intentionally not customizable. -->
      <span class="titlebar-by">by Pixelplayz2215</span>
      <span class="titlebar-crumb" id="crumb"></span>
    </header>

    <div class="shell">
      <nav class="rail" id="rail"></nav>
      <main class="page" id="page"></main>
    </div>

    <div class="toasts" id="toasts"></div>
    <div class="modal-root" id="modal-root"></div>

    <script src="js/core.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/home.js"></script>
    <script src="js/bot.js"></script>
    <script src="js/server.js"></script>
    <script src="js/raid.js"></script>
    <script src="js/automod.js"></script>
    <script src="js/backups.js"></script>
    <script src="js/serverlogs.js"></script>
    <script src="js/permissions.js"></script>
    <script src="js/builder.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/updates.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
